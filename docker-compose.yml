version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: airfare_cpi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airfare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airfare}
      POSTGRES_DB: ${POSTGRES_DB:-airfare_cpi}
    # Bound to loopback so the database is not exposed on the host's network
    # interfaces. Previously "5432:5432" published it on all interfaces with the
    # default password 'airfare'.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airfare"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airfare_cpi_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airfare}:${POSTGRES_PASSWORD:-airfare}@db:5432/${POSTGRES_DB:-airfare_cpi}
      # Live is the safe default: missing credentials yield SOURCE UNAVAILABLE and
      # never trigger a simulator fallback. Use SIMULATED only for explicit demos.
      COLLECTION_MODE: ${COLLECTION_MODE:-LIVE}
      ENABLED_SOURCES: ${ENABLED_SOURCES:-amadeus}
      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}
      AMADEUS_ENVIRONMENT: ${AMADEUS_ENVIRONMENT:-test}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      INDEX_BASE_PERIOD_START: ${INDEX_BASE_PERIOD_START:-2026-09-03}
      INDEX_BASE_PERIOD_DAYS: ${INDEX_BASE_PERIOD_DAYS:-7}
      BOOKING_HORIZONS: ${BOOKING_HORIZONS:-1,7,15,30,45}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_COLLECTION_HOURS: ${SCHEDULER_COLLECTION_HOURS:-10,18}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Kolkata}
      # Mutation endpoints fail closed until this is set.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      DB_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "alembic -c /app/alembic.ini upgrade head && exec uvicorn api.main:app --host 0.0.0.0 --port 8000"]

volumes:
  pgdata:
