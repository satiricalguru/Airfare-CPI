version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: airfare_cpi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airfare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airfare}
      POSTGRES_DB: ${POSTGRES_DB:-airfare_cpi}
    # Bound to loopback so the database is not exposed on the host's network
    # interfaces. Previously "5432:5432" published it on all interfaces with the
    # default password 'airfare'.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/seed_routes.sql:/docker-entrypoint-initdb.d/02-seed-routes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airfare"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airfare_cpi_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # NOTE: the API does not connect to PostgreSQL yet (AUDIT.md Q1). These are
      # passed so the wiring is ready, but storage is currently in-process only.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airfare}:${POSTGRES_PASSWORD:-airfare}@db:5432/${POSTGRES_DB:-airfare_cpi}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-airfare}:${POSTGRES_PASSWORD:-airfare}@db:5432/${POSTGRES_DB:-airfare_cpi}
      # 'mock' tags all output as data_provenance="synthetic".
      SCRAPER_MODE: ${SCRAPER_MODE:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      INDEX_BASE_PERIOD_START: ${INDEX_BASE_PERIOD_START:-2026-08-01}
      INDEX_BASE_PERIOD_DAYS: ${INDEX_BASE_PERIOD_DAYS:-7}
      BOOKING_HORIZONS: ${BOOKING_HORIZONS:-0,3,7,15,30}
      # Set this before exposing the API beyond localhost, or anyone can trigger a
      # collection cycle and mutate the published index.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
