name: Deploy Airfare CPI to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The 30-test backend suite previously never ran in CI, so a regression in the
  # index engine could reach main and deploy unnoticed.
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: ./backend
        run: python -m pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  # Guard against an API key or other credential being committed into the
  # frontend bundle again (see AUDIT.md C1).
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          set -euo pipefail
          # Google API key literals (AIza...) must never appear in source.
          if grep -rnE '"AIza[0-9A-Za-z_-]{20,}"' \
               --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
               --include='*.mjs' --include='*.json' --include='*.py' \
               --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=out .; then
            echo "::error::Hardcoded API key literal found. Move it to a server-side environment variable."
            exit 1
          fi
          echo "No hardcoded API key literals found."

  build:
    name: Build static export
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint, secret-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Static Export for GitHub Pages
        working-directory: ./frontend
        env:
          DEPLOY_TARGET: gh-pages
          # NOTE: this backend is not deployed by this repository. When it is
          # unreachable the dashboard shows its offline preview banner rather than
          # presenting placeholder values as live measurements.
          NEXT_PUBLIC_API_URL: https://airfare-cpi-api.onrender.com
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    name: Deploy
    # Only publish from main, never from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
